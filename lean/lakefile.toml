name = "conway7"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Conway7"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc2"

[[lean_lib]]
name = "Conway7"

# The statement alone (imports Mathlib only; every proof is `sorry`), and its proofs.
# `lake comparator` (config: comparator.json) checks that the two state exactly the same theorems.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
